<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Sri Ramachandra Engineering and Technology Seal">
  <defs>
    <radialGradient id="rg" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#d84747"/>
      <stop offset="55%" stop-color="#bf2228"/>
      <stop offset="100%" stop-color="#6f1a1f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5c373"/>
      <stop offset="50%" stop-color="#c8a15a"/>
      <stop offset="100%" stop-color="#8a6a2f"/>
    </linearGradient>
    <path id="topArc" d="M 36,120 A 84,84 0 0 1 204,120" fill="none"/>
    <path id="botArc" d="M 40,128 A 80,80 0 0 0 200,128" fill="none"/>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.6"/>

  <!-- Main medallion -->
  <circle cx="120" cy="120" r="94" fill="url(#rg)"/>
  <circle cx="120" cy="120" r="94" fill="none" stroke="#fbf8ef" stroke-width="1.5" opacity="0.8"/>

  <!-- Inner decorative ring -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.9"/>

  <!-- Top arched text: SRI RAMACHANDRA -->
  <text font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600"
        letter-spacing="3" fill="#fbf8ef">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      SRI RAMACHANDRA
    </textPath>
  </text>

  <!-- Bottom arched text: ENGINEERING & TECHNOLOGY -->
  <text font-family="Cormorant Garamond, Georgia, serif" font-size="11" font-weight="600"
        letter-spacing="3" fill="#fbf8ef">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">
      ENGINEERING · TECHNOLOGY
    </textPath>
  </text>

  <!-- Central emblem: stylised open book + flame (knowledge & aspiration) -->
  <g transform="translate(120,118)">
    <!-- Flame/lamp -->
    <path d="M 0,-42 C -8,-28 -14,-20 -10,-8 C -6,2 6,2 10,-8 C 14,-20 8,-28 0,-42 Z"
          fill="#e5c373" stroke="#fbf8ef" stroke-width="0.8"/>
    <!-- Lamp base -->
    <rect x="-14" y="-6" width="28" height="4" rx="1" fill="#fbf8ef"/>
    <rect x="-16" y="-3" width="32" height="3" fill="#e5c373"/>

    <!-- Open book pages -->
    <path d="M -34,4 L -2,0 L 2,0 L 34,4 L 34,22 L 2,18 L -2,18 L -34,22 Z"
          fill="#fbf8ef" stroke="#8a6a2f" stroke-width="1"/>
    <line x1="0" y1="1" x2="0" y2="19" stroke="#8a6a2f" stroke-width="1"/>

    <!-- Page lines -->
    <line x1="-26" y1="9" x2="-6" y2="7" stroke="#c8a15a" stroke-width="0.7"/>
    <line x1="-26" y1="13" x2="-6" y2="11" stroke="#c8a15a" stroke-width="0.7"/>
    <line x1="6" y1="7" x2="26" y2="9" stroke="#c8a15a" stroke-width="0.7"/>
    <line x1="6" y1="11" x2="26" y2="13" stroke="#c8a15a" stroke-width="0.7"/>
  </g>

  <!-- Side laurels -->
  <g fill="none" stroke="#e5c373" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <path d="M 42,120 Q 48,100 58,92"/>
    <path d="M 46,128 Q 52,120 60,116"/>
    <path d="M 44,136 Q 50,140 58,142"/>
    <path d="M 198,120 Q 192,100 182,92"/>
    <path d="M 194,128 Q 188,120 180,116"/>
    <path d="M 196,136 Q 190,140 182,142"/>
  </g>

  <!-- Small stars flanking top -->
  <g fill="#e5c373">
    <circle cx="62" cy="62" r="1.8"/>
    <circle cx="178" cy="62" r="1.8"/>
    <circle cx="120" cy="36" r="2.2"/>
  </g>

  <!-- Decorative stars along the bottom -->
  <g fill="#e5c373" opacity="0.9">
    <circle cx="120" cy="202" r="2"/>
    <circle cx="100" cy="198" r="1.4"/>
    <circle cx="140" cy="198" r="1.4"/>
  </g>
</svg>
